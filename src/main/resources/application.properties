spring.application.name=campus-parking-backend
server.port=8080

# H2 Database Configuration (Zero-installation Database)
spring.datasource.url=jdbc:h2:mem:campus_parking_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console Configuration (View DB tables in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Static resource handling
spring.web.resources.static-locations=classpath:/static/
